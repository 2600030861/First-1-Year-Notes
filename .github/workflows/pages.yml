name: Deploy notes site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # the site folder, wherever it currently sits in the repo
      - name: Find the site folder
        id: site
        run: |
          for d in notes-website first-year-notes-website/notes-website; do
            if [ -f "$d/index.html" ]; then
              echo "Using $d"
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No site folder found. Expected notes-website/index.html"
          ls -1
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.dir }}

      - id: deployment
        uses: actions/deploy-pages@v4